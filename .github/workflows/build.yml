name: Build MADENCITUNE
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Installer (exe)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MadenciTune.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MADENCITUNE_Setup
          path: dist/MADENCITUNE_Setup.exe
